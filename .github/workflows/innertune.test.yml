name: Innertune test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    
    container:
      image: ghcr.io/liuxunchenglxc/my_drissionpage_env:latest
      options: --ipc=host 

    steps:
      - uses: actions/checkout@v6

      # - name: Set up proxy
      #   if: always()
      #   run: |
      #     nohup gost -L http://127.0.0.1:1080 -F "${{ secrets.PROXY }}" >/tmp/gost.log 2>&1 &

      - name: Cache HY-MT
        uses: actions/cache@v6
        with:
          path: .hymt
          key: hymt-${{ runner.os }}-${{ runner.arch }}-q4-v1

      - name: Innertune
        if: always()
        run: |
          xvfb-run --server-args="-screen 0 1920x1080x24" python3 -u innertune.py \
            --pterclubcookies "${{ secrets.PTER_COOK }}" \
            --tgbottoken "${{ secrets.TG_BOT_TOKEN }}" \
            --tgchatid "${{ secrets.TG_CHAT_ID }}" \
            --fnyuser "${{ secrets.FNY_USER }}" \
            --fnypswd "${{ secrets.FNY_PSWD }}" \
            --proxy "${{ secrets.PROXY }}" \
            --resendkey "${{ secrets.RESEND_KEY }}" \
            --storetoken "${{ secrets.STORE_TOKEN }}"
            
