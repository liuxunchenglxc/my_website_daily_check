name: Discord test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    
    container:
      image: ghcr.io/liuxunchenglxc/my_drissionpage_env:latest
      options: --ipc=host 

    steps:
      - uses: actions/checkout@v6

      - run: |
          xvfb-run --server-args="-screen 0 1920x1080x24" python3 discord.py \
            --tgbottoken "${{ secrets.TG_BOT_TOKEN }}" \
            --tgchatid "${{ secrets.TG_CHAT_ID }}" \
            --proxy "${{ secrets.PROXY }}" \
            --resendkey "${{ secrets.RESEND_KEY }}" \
            --discorduser "${{ secrets.DISCORD_USER }}" \
            --discordpswd "${{ secrets.DISCORD_PSWD }}"
            
