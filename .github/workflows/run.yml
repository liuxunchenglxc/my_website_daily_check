name: DrissionPage Actor

on:
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    
    container:
      image: ghcr.io/liuxunchenglxc/my_drissionpage_env:latest
      options: --ipc=host 

    steps:
      - uses: actions/checkout@v6

      - name: PterClub签到
        run: |
          xvfb-run --server-args="-screen 0 1920x1080x24" python3 main.py \
            --pterclubcookies "${{ secrets.PTER_COOK }}" \
            --tgbottoken "${{ secrets.TG_BOT_TOKEN }}" \
            --tgchatid "${{ secrets.TG_CHAT_ID }}"
      
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: fnyhash.txt
          key: fnyhash-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fnyhash-

      - name: 飞鸟云更新
        if: always()
        run: |
          xvfb-run --server-args="-screen 0 1920x1080x24" python3 fny.py \
            --pterclubcookies "${{ secrets.PTER_COOK }}" \
            --tgbottoken "${{ secrets.TG_BOT_TOKEN }}" \
            --tgchatid "${{ secrets.TG_CHAT_ID }}" \
            --fnyuser "${{ secrets.FNY_USER }}" \
            --fnypswd "${{ secrets.FNY_PSWD }}" \
            --proxy "${{ secrets.PROXY }}" \
            --resendkey "${{ secrets.RESEND_KEY }}"
      
      - name: Save Updated Value
        uses: actions/cache/save@v6
        with:
          path: fnyhash.txt
          key: fnyhash-${{ github.run_id }}-${{ github.run_attempt }}
